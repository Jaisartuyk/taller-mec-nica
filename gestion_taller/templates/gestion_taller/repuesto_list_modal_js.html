<script>
document.getElementById('nuevoRepuestoBtn').addEventListener('click', function() {
  fetch("{% url 'repuesto_nuevo' %}", {
    headers: {'X-Requested-With': 'XMLHttpRequest'}
  })
  .then(response => response.text())
  .then(html => {
    document.getElementById('modalRepuestoBody').innerHTML = html;
    attachRepuestoFormHandler();
  });
});

function attachRepuestoFormHandler() {
  const form = document.querySelector('#modalRepuestoBody form');
  if (form) {
    form.onsubmit = async function(e) {
      e.preventDefault();
      const formData = new FormData(form);
      const response = await fetch(form.action, {
        method: 'POST',
        body: formData,
        headers: {'X-Requested-With': 'XMLHttpRequest'},
      });
      let isJson = false;
      let data;
      try {
        data = await response.json();
        isJson = true;
      } catch (e) {
        data = await response.text();
      }
      if (isJson && data.success) {
        var modal = bootstrap.Modal.getInstance(document.getElementById('modalRepuesto'));
        const modalElement = document.getElementById('modalRepuesto');
        
        // Cerrar el modal correctamente
        modal.hide();
        
        // Esperar a que el modal se cierre completamente antes de recargar
        modalElement.addEventListener('hidden.bs.modal', function() {
          // Limpiar cualquier backdrop residual
          const backdrops = document.querySelectorAll('.modal-backdrop');
          backdrops.forEach(backdrop => backdrop.remove());
          
          // Restaurar el scroll del body
          document.body.classList.remove('modal-open');
          document.body.style.overflow = '';
          document.body.style.paddingRight = '';
          
          // Recargar la página
          location.reload();
        }, { once: true }); // Solo ejecutar una vez
      } else {
        document.getElementById('modalRepuestoBody').innerHTML = data;
        attachRepuestoFormHandler();
      }
    }
  }
}
</script>
