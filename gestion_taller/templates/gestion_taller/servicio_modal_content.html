<!-- Contenido del formulario para el modal -->
<form id="formServicio" method="post" action="{{ request.path }}" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="modal-header">
        <h5 class="modal-title" id="modalServicioLabel">
            {% if form.instance.pk %}Editar{% else %}Nuevo{% endif %} Servicio
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
    </div>
    <div class="modal-body">
        <div class="container-fluid">
            {% for field in form %}
                <div class="mb-3">
                    <label for="{{ field.id_for_label }}" class="form-label">
                        {{ field.label }}{% if field.field.required %}<span class="text-danger">*</span>{% endif %}
                    </label>
                    {{ field }}
                    {% if field.help_text %}
                        <div class="form-text">{{ field.help_text }}</div>
                    {% endif %}
                    {% if field.errors %}
                        <div class="invalid-feedback d-block">
                            {{ field.errors|join:", " }}
                        </div>
                    {% endif %}
                </div>
            {% endfor %}
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="submit" class="btn btn-primary">
            <i class="fas fa-save me-1"></i> Guardar
        </button>
    </div>
</form>

<!-- Script para inicializar componentes del formulario -->
<script>
$(document).ready(function() {
    // Inicializar selects con select2 si está disponible
    if ($.fn.select2) {
        $('select').select2({
            dropdownParent: $('#modalServicio'),
            width: '100%',
            theme: 'bootstrap-5'
        });
    }
    
    // Manejar envío del formulario
    $('#formServicio').on('submit', function(e) {
        e.preventDefault();
        const form = $(this);
        
        $.ajax({
            url: form.attr('action'),
            type: 'POST',
            data: form.serialize(),
            headers: {'X-Requested-With': 'XMLHttpRequest'},
            success: function(response) {
                if (response.success) {
                    // Actualizar la grilla
                    $('#servicios-grid').html(response.grid);
                    // Cerrar el modal
                    const modal = bootstrap.Modal.getInstance(document.getElementById('modalServicio'));
                    modal.hide();
                    // Mostrar notificación
                    showToast('success', 'Servicio guardado correctamente');
                } else {
                    // Mostrar errores del formulario
                    $('.invalid-feedback').remove();
                    $('.is-invalid').removeClass('is-invalid');
                    
                    if (response.errors) {
                        Object.entries(response.errors).forEach(([field, errors]) => {
                            const input = $(`#id_${field}`);
                            input.addClass('is-invalid');
                            input.after(`<div class="invalid-feedback d-block">${errors.join(' ')}</div>`);
                        });
                    }
                }
            },
            error: function(xhr) {
                console.error('Error al guardar el servicio', xhr);
                showToast('error', 'Error al guardar el servicio');
            }
        });
    });
});
</script>
