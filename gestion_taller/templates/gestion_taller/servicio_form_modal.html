{% load crispy_forms_tags %}
{% load static %}
<form method="post" id="servicioForm" class="modal-form" action="{% url 'servicio_nuevo' %}">
    {% csrf_token %}
    <div class="modal-body">
        {{ form|crispy }}
    </div>
    <div class="modal-footer modal fade" id="modalServicio" tabindex="-1">
        <button type="submit" class="btn btn-success">Guardar</button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
    </div>
</form>
