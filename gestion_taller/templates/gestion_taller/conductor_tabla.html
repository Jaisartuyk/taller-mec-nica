<table class="table table-striped table-hover" id="tablaConductores">
    <thead class="table-dark">
        <tr>
            <th>Nombre</th>
            <th>Teléfono</th>
            <th>Correo</th>
            <th>Dirección</th>
            <th class="text-end">Acciones</th>
        </tr>
    </thead>
    <tbody>
        {% for conductor in conductores %}
        <tr>
            <td>{{ conductor.nombre }}</td>
            <td>{{ conductor.telefono }}</td>
            <td>{{ conductor.correo }}</td>
            <td>{{ conductor.direccion }}</td>
            <td class="text-nowrap">
                <div class="btn-group btn-group-sm" role="group">
                    <a href="{% url 'conductor_editar' conductor.pk %}"
                       class="btn btn-primary btn-editar-conductor"
                       title="Editar"
                       data-modal-target="modalConductorEditar"
                       data-url="{% url 'conductor_editar' conductor.pk %}">
                        <i class="bi bi-pencil"></i>
                    </a>
                    <a href="{% url 'conductor_eliminar' conductor.pk %}"
                       class="btn btn-danger"
                       title="Eliminar"
                       data-modal-target="modalConductorEliminar"
                       data-url="{% url 'conductor_eliminar' conductor.pk %}">
                        <i class="bi bi-trash"></i>
                    </a>
                </div>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="5" class="text-center py-4">
                <div class="text-muted">
                    <i class="bi bi-person fs-1 d-block mb-2"></i>
                    No hay conductores registrados
                </div>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
