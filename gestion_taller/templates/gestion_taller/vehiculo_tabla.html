{% for vehiculo in vehiculos %}
<tr>
    <td>{{ vehiculo.marca }}</td>
    <td>{{ vehiculo.modelo }}</td>
    <td>{{ vehiculo.anio }}</td>
    <td>{{ vehiculo.placa }}</td>
    <td>{{ vehiculo.conductor|default:"Sin conductor" }}</td>
    <td>
        <button type="button" class="btn btn-warning btn-sm open-modal-btn"
                data-modal-target="formModal"
                data-url="{% url 'vehiculo_editar' vehiculo.pk %}">
            <i class="bi bi-pencil-square"></i> Editar
        </button>
        <button type="button" class="btn btn-danger btn-sm open-modal-btn"
                data-modal-target="deleteModal"
                data-url="{% url 'vehiculo_eliminar' vehiculo.pk %}">
            <i class="bi bi-trash"></i> Eliminar
        </button>
    </td>
</tr>
{% empty %}
<tr>
    <td colspan="6" class="text-center">No hay vehículos registrados.</td>
</tr>
{% endfor %}
