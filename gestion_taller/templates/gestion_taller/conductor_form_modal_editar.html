{% load crispy_forms_tags %}
<div class="modal-dialog">
  <div class="modal-content">
    <div class="modal-header">
      <h5 class="modal-title" id="modalConductorEditarLabel">Editar Conductor</h5>
      <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
    </div>
    <div class="modal-body">
      <form id="formEditarConductor" method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <div class="text-end mt-3">
          <button type="submit" class="btn btn-primary">Guardar cambios</button>
        </div>
      </form>
    </div>
  </div>
</div>
<script>
$(document).on('submit', '#formEditarConductor', function(e) {
  e.preventDefault();
  var $form = $(this);
  $.ajax({
    url: $form.attr('action') || window.location.href,
    type: 'POST',
    data: $form.serialize(),
    success: function(data) {
      if (data.success) {
        $('#modalConductorEditar').modal('hide');
        if (data.tabla) {
          $('#tablaConductores').html(data.tabla);
        }
        // Mensaje opcional
        // toastr.success('Conductor editado correctamente');
      } else {
        $('.modal-body', '#modalConductorEditar').html($(data).find('.modal-body').html());
      }
    },
    error: function() {
      alert('Error al guardar los cambios.');
    }
  });
});
</script>
