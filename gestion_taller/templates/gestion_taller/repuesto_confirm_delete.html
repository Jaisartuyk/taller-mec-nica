{% extends 'gestion_taller/base.html' %}
{% block title %}Eliminar Repuesto{% endblock %}
{% block content %}
<h2>¿Estás seguro que deseas eliminar este repuesto?</h2>
<p><strong>{{ object.nombre }}</strong></p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Sí, eliminar</button>
    <a href="{% url 'repuestos' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
