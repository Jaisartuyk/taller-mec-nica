{% load static %}
<div class="modal-content">
    <div class="modal-header bg-primary text-white">
        <h5 class="modal-title">
            {% if form.instance.pk %}Editar{% else %}Nuevo{% endif %} Vehículo
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                        <div class="form-group">
                            <label for="{{ form.conductor.id_for_label }}" class="form-label">{{ form.conductor.label }}</label>
                            {{ form.conductor }}
                            {% if form.conductor.errors %}
                                <div class="invalid-feedback d-block">
                                    {{ form.conductor.errors|join:", " }}
                                </div>
                            {% endif %}
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-save me-1"></i> Guardar
                </button>
            </div>
        </form>
    </div>
</div>

<script>
$(document).ready(function() {
    // Inicializar tooltips
    var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
    var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
        return new bootstrap.Tooltip(tooltipTriggerEl);
    });

    // Manejar el envío del formulario vía AJAX
    $('#vehiculoForm').on('submit', function(e) {
        e.preventDefault();
        var form = $(this);
        
        $.ajax({
            url: form.attr('action'),
            type: 'POST',
            data: form.serialize(),
            success: function(response) {
                if (response.success) {
                    // Cerrar el modal
                    var modal = bootstrap.Modal.getInstance(document.getElementById('modalVehiculo'));
                    modal.hide();
                    
                    // Recargar la tabla de vehículos
                    $('#vehiculosTable').html(response.tabla);
                    
                    // Mostrar notificación de éxito
                    showToast('Vehículo guardado correctamente', 'success');
                } else {
                    // Mostrar errores de validación
                    $('#modalVehiculo .modal-body').html(response.form);
                }
            },
            error: function(xhr, status, error) {
                console.error('Error al guardar el vehículo:', error);
                showToast('Error al guardar el vehículo', 'error');
            }
        });
    });
});
</script>
