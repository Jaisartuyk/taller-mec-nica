{% extends 'gestion_taller/base.html' %}

{% block title %}Conductores{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <h4 class="mb-0"><i class="bi bi-people-fill me-2"></i>Conductores</h4>
            {% url 'conductor_nuevo' as conductor_nuevo_url %}
            <button type="button" class="btn btn-light" 
                    onclick="openModal('{{ conductor_nuevo_url }}', 'Nuevo Conductor', 'modalConductor')">
                <i class="bi bi-plus-circle me-1"></i> Nuevo Conductor
            </button>
        </div>
        <div class="card-body">
            <div class="table-responsive" id="contenedor-tabla-conductores">
                {% include 'gestion_taller/conductor_tabla.html' %}
            </div>
        </div>
    </div>
</div>

<!-- El modal se crea dinámicamente cuando se hace clic en el botón -->
{% endblock %}
